name: Sunshine V4 isolated persistent tests

on:
  push:
    branches:
      - v4-isolated-foundation
    paths:
      - 'v4/**'
      - '.github/workflows/v4-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: sunshine_v4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sunshine_v4_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: v4
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated_test_only@127.0.0.1:5432/sunshine_v4_test
      V4_ENVIRONMENT: ci
      V4_ISOLATED_DEMO: '1'
      V4_DEMO_AUTH_SECRET: ci-only-secret-123456789
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime has no production references or secrets
        run: |
          check() { if grep -R --exclude='db.js' -E "$1" src public migrations; then echo "Blocked production reference: $1"; exit 1; fi; }
          check 'dhpsvwkytcqasmtaeayv'
          check 'sunshine\.ymnegocios\.com\.br'
          check 'sunshine-ecossistema\.vercel\.app'
          check 'ASAAS_API_KEY|SUPABASE_SERVICE_ROLE_KEY|service_role'
      - name: Install dependencies and maintain lockfile
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Version generated package-lock when needed
        if: github.actor != 'github-actions[bot]'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "v4: versionar package-lock isolado"
            git push origin HEAD:v4-isolated-foundation
          fi
      - name: Install Chromium for isolated UI tests
        run: npx playwright install --with-deps chromium
      - name: Run all unit, PostgreSQL, API, authorization and UI tests
        run: npm test
      - name: Validate representative fictitious dataset and reconciliation
        run: node src/validate-seed.js
      - name: Validate preview smoke contract against isolated PostgreSQL
        run: |
          PORT=4174 node src/server.js > /tmp/sunshine-v4-smoke.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/api/health >/dev/null; then break; fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4174 npm run smoke:preview
