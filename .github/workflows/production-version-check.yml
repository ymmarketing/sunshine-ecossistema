name: Sunshine production version check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sunshine-production-version-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check assets/v47.js
          node --check assets/v48.js
          node --check assets/v49.js
          node --check assets/v50.js
          node --check assets/v51.js
          node --check assets/v52.js
          node --check assets/v53.js
          node --check assets/v54.js
          node --check assets/v55.js
          node --check assets/v56.js
          node --check assets/v57.js

      - name: Regression guard for client association search
        shell: bash
        run: |
          grep -Fq "v_digits<>''" supabase/migrations/20260908204500_fix_client_search_v359.sql
          grep -Fq "fn!=='search_clients_v349'" assets/v57.js
          grep -Fq "nenhuma cliente foi selecionada" assets/v57.js

      - name: Read repository version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o 'meta name="sunshine-version" content="v[0-9.]*"' index.html | sed -E 's/.*content="(v[0-9.]+)"/\1/' | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          grep -q 'assets/v47.js' index.html
          grep -q 'assets/v48.js' index.html
          grep -q 'assets/v49.js' index.html
          grep -q 'assets/v50.js' index.html
          grep -q 'assets/v51.js' index.html
          grep -q 'assets/v52.js' index.html
          grep -q 'assets/v53.js' index.html
          grep -q 'assets/v54.js' index.html
          grep -q 'assets/v55.js' index.html
          grep -q 'assets/v56.js' index.html
          grep -q 'assets/v57.js' index.html

      - name: Verify both official domains
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
          MAX_ATTEMPTS: '60'
          SLEEP_SECONDS: '30'
        shell: bash
        run: |
          set -uo pipefail

          DOMAIN_ONE='https://sunshine.ymnegocios.com.br/'
          DOMAIN_TWO='https://sunshine-ecossistema.vercel.app/'

          fetch_url() {
            local url="$1"
            curl -fsSL \
              --connect-timeout 5 \
              --max-time 20 \
              --retry 2 \
              --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              "${url}?version-check=${GITHUB_SHA}"
          }

          verify_html() {
            local html="$1"
            grep -Fq "meta name=\"sunshine-version\" content=\"${EXPECTED}\"" <<< "$html" || return 1
            for asset in v47.js v48.js v49.js v50.js v51.js v52.js v53.js v54.js v55.js v56.js v57.js; do
              grep -Fq "$asset" <<< "$html" || return 1
            done
          }

          verify_service_worker() {
            local sw="$1"
            grep -Fq "CACHE_NAME='sunshine-${EXPECTED}'" <<< "$sw" || return 1
            grep -Fq 'skipWaiting' <<< "$sw" || return 1
            grep -Fq 'clients.claim' <<< "$sw" || return 1
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Production check ${attempt}/${MAX_ATTEMPTS} — expecting ${EXPECTED}"

            HTML_ONE=$(fetch_url "$DOMAIN_ONE" 2>/dev/null || true)
            HTML_TWO=$(fetch_url "$DOMAIN_TWO" 2>/dev/null || true)

            if verify_html "$HTML_ONE" && verify_html "$HTML_TWO"; then
              HASH_ONE=$(printf '%s' "$HTML_ONE" | sha256sum | cut -d' ' -f1)
              HASH_TWO=$(printf '%s' "$HTML_TWO" | sha256sum | cut -d' ' -f1)

              if [[ "$HASH_ONE" == "$HASH_TWO" ]]; then
                SW=$(fetch_url 'https://sunshine.ymnegocios.com.br/sw.js' 2>/dev/null || true)
                if verify_service_worker "$SW"; then
                  echo "Production verified: ${EXPECTED} is active and identical on both official domains."
                  exit 0
                fi
              fi
            fi

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              echo 'Production has not converged yet; retrying after propagation interval.'
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "Production did not converge to ${EXPECTED} on both official domains within the validation window." >&2
          exit 1
