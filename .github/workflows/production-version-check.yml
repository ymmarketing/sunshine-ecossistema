name: Sunshine production health check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sunshine-production-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/app.js assets/v*.js assets/password-guard.js assets/login-alias.js assets/config.js assets/bundle.js; do
            node --check "$f"
          done

      - name: Guard login bootstrap and client association
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-sunshine-version="v3.61"' index.html
          grep -Fq "typeof bootstrap==='function'" index.html
          grep -Fq "document.addEventListener('DOMContentLoaded',bootstrap)" assets/bundle.js
          grep -Fq "fn!=='search_clients_v349'" assets/bundle.js
          grep -Fq 'nenhuma cliente foi selecionada' assets/bundle.js
          grep -Fq "CACHE_NAME='sunshine-v3.61'" sw.js

      - name: Verify both official domains
        shell: bash
        run: |
          set -euo pipefail
          for domain in 'https://sunshine.ymnegocios.com.br/' 'https://sunshine-ecossistema.vercel.app/'; do
            html=$(curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "${domain}?health=${GITHUB_SHA}")
            grep -Fq 'data-sunshine-version="v3.61"' <<< "$html"
            grep -Fq "typeof bootstrap==='function'" <<< "$html"
            grep -Fq 'id="loginForm"' <<< "$html"
          done
          sw=$(curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "https://sunshine.ymnegocios.com.br/sw.js?health=${GITHUB_SHA}")
          grep -Fq "CACHE_NAME='sunshine-v3.61'" <<< "$sw"
          grep -Fq 'skipWaiting' <<< "$sw"
          grep -Fq 'clients.claim' <<< "$sw"
