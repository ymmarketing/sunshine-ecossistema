name: Sunshine production health check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sunshine-production-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node tests/check-syntax.cjs
          for f in assets/app.js assets/v*.js assets/password-guard.js assets/login-alias.js assets/config.js assets/bundle.js; do
            node --check "$f"
          done

      - name: Guard repository Sunshine V4 flow
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<meta name="application-name" content="Sunshine V4">' index.html
          grep -Fq 'id="loginForm"' index.html
          grep -Fq 'function isProductionHost()' index.html
          grep -Fq 'v4_payment_detail' index.html
          grep -Fq 'v4_api_set_commission_status' index.html
          grep -Fq 'v4_api_dismiss_pending_items' index.html
          grep -Fq 'v4_api_update_registration_name' index.html
          grep -Fq 'Editar nome do inscrito' index.html
          grep -Fq 'v4_api_regularize_obligation' index.html
          grep -Fq 'Regularizar pagamento' index.html
          test -f docs/FLUXO_FINANCEIRO_INSCRICOES_V1.md

      - name: Verify Sunshine V4 on both official domains
        shell: bash
        run: |
          set -euo pipefail
          for domain in 'https://sunshine.ymnegocios.com.br/' 'https://sunshine-ecossistema.vercel.app/'; do
            # Git integration builds asynchronously. Verify the actual files after it finishes.
            matched=false
            for attempt in $(seq 1 12); do
              curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "${domain}?health=${GITHUB_SHA}-${attempt}" -o "$RUNNER_TEMP/sunshine-production.html" || true
              curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "${domain}assets/finance-operations.js?health=${GITHUB_SHA}-${attempt}" -o "$RUNNER_TEMP/sunshine-production.js" || true
              curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "${domain}assets/people.css?health=${GITHUB_SHA}-${attempt}" -o "$RUNNER_TEMP/sunshine-people.css" || true
              if cmp -s index.html "$RUNNER_TEMP/sunshine-production.html" && cmp -s assets/finance-operations.js "$RUNNER_TEMP/sunshine-production.js" && cmp -s assets/people.css "$RUNNER_TEMP/sunshine-people.css"; then
                matched=true
                break
              fi
              sleep 15
            done
            if [ "$matched" != true ]; then
              echo "Production files do not match commit ${GITHUB_SHA}: ${domain}"
              exit 1
            fi
            html=$(curl -fsSL --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "${domain}?health=${GITHUB_SHA}")

            # Core V4 shell and login must be present.
            grep -Fq '<meta name="application-name" content="Sunshine V4">' <<< "$html"
            grep -Fq 'id="loginForm"' <<< "$html"
            grep -Fq 'function isProductionHost()' <<< "$html"

            # Critical operational fixes currently required in production.
            grep -Fq 'v4_payment_detail' <<< "$html"
            grep -Fq 'v4_api_set_commission_status' <<< "$html"
            grep -Fq 'p_paid_on' <<< "$html"
            grep -Fq 'v4_api_dismiss_pending_items' <<< "$html"
            grep -Fq 'O QUE ESTE PAGAMENTO COBRIU' <<< "$html"
            grep -Fq 'v4_api_update_registration_name' <<< "$html"
            grep -Fq 'Editar nome do inscrito' <<< "$html"
            grep -Fq 'v4_api_regularize_obligation' <<< "$html"
            grep -Fq 'Regularizar pagamento' <<< "$html"

            # Essential install assets must also resolve successfully.
            curl -fsSL --connect-timeout 8 --max-time 25 -o /dev/null "${domain}manifest.webmanifest?health=${GITHUB_SHA}"
            curl -fsSL --connect-timeout 8 --max-time 25 -o /dev/null "${domain}assets/sunshine-app-icon.svg?health=${GITHUB_SHA}"
          done
