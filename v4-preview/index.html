<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine V4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f7f5f1;margin:0;color:#24211e}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.panel{background:#fff;border:1px solid #ddd7cf;border-radius:16px;padding:16px}.card{width:min(390px,100%)}input,button,select,textarea{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 10px;border:1px solid #c9c4bc;border-radius:10px}button{padding:11px 14px;border:0;border-radius:10px;font-weight:700;background:#2c2925;color:#fff;cursor:pointer}.shell{max-width:1100px;margin:auto;padding:14px}.top{background:#fff;border-bottom:1px solid #ddd7cf;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.nav button{background:#ece8e1;color:#24211e}.nav button.active{background:#2c2925;color:#fff}.grid{display:grid;gap:10px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.metric{background:#fff;border:1px solid #ddd7cf;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}.row{background:#fff;border:1px solid #ddd7cf;border-radius:12px;padding:12px}.muted{color:#756f67;font-size:12px}.error{color:#a1261f;font-weight:700}.ok{color:#256a3b;font-weight:700}.page{display:none}.page.active{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.two{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px}}</style></head><body>
<section id="login" class="login"><div class="card"><small>SUNSHINE V4</small><h1>Acessar</h1><p class="muted">Preview funcional. A V3 continua intacta.</p><form id="loginForm"><label>Usuário</label><input id="username" autocomplete="username" placeholder="Yasmin, Rosely ou Lourdes" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit" style="width:100%">Entrar</button></form><p id="loginMsg" class="muted"></p></div></section>
<div id="app" class="hidden"><header class="top"><div><b>Sunshine V4</b><div id="who" class="muted"></div></div><button id="logout">Sair</button></header><main class="shell"><div class="panel"><b>V4 em validação</b><p class="muted">Schema separado sunshine_v4. Sem Asaas ou integrações reais nesta interface.</p></div><nav class="nav"><button data-page="home" class="active">Home</button><button data-page="people">Pessoas</button><button data-page="contracts">Contratações</button><button data-page="finance">Financeiro</button><button data-page="receivables">Saldos</button><button data-page="collections">Cobrança</button><button data-page="permissions">Permissões</button></nav>
<section id="home" class="page active"><h2>Home</h2><div id="homeMetrics" class="metrics"></div><div class="panel"><h3>Trabalhos disponíveis</h3><div id="openWorks" class="grid"></div></div></section>
<section id="people" class="page"><h2>Pessoas</h2><div class="panel"><div class="two"><input id="peopleQuery" placeholder="Nome, telefone ou e-mail"><button id="peopleSearch">Buscar</button></div><button id="newPerson">+ Pessoa</button></div><div id="peopleList" class="grid"></div></section>
<section id="contracts" class="page"><h2>Contratações</h2><button id="newEntry1">+ Nova contratação</button><div id="contractList" class="grid"></div></section>
<section id="finance" class="page"><h2>Financeiro</h2><div class="panel"><div class="two"><input id="dateStart" type="date"><input id="dateEnd" type="date"></div><div class="actions"><button id="financeApply">Aplicar</button><button id="newEntry2">+ Registrar entrada</button></div></div><div id="financeMetrics" class="metrics"></div><div id="paymentList" class="grid"></div></section>
<section id="receivables" class="page"><h2>Obrigações / saldos</h2><div id="receivableList" class="grid"></div></section>
<section id="collections" class="page"><h2>Cobrança</h2><div id="collectionList" class="grid"></div></section>
<section id="permissions" class="page"><h2>Permissões</h2><div id="permissionList" class="panel"></div></section>
<div id="modal" class="hidden panel" style="position:fixed;inset:5%;overflow:auto;z-index:50"><div class="actions"><button id="closeModal">Fechar</button></div><div id="modalBody"></div></div></main></div>
<script>
(function(){
'use strict';
const URL='https://dhpsvwkytcqasmtaeayv.supabase.co';
const KEY='sb_publishable_4E1ODSLKb3wkFXBLeMKJCw_5nGlycsz';
const aliases={yasmin:'yasmin@sunshine.local',rosely:'rosely@sunshine.local',lourdes:'lourdes@sunshine.local'};
const el=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=v=>Math.round(Number(String(v||'0').replace(/\./g,'').replace(',','.'))*100)||0;
const state={me:null,people:[],services:[],team:[],works:[]};
let sb=null;
function msg(t,kind=''){el('loginMsg').textContent=t;el('loginMsg').className=kind||'muted';}
async function rpc(name,args={}){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data;}
function has(p){return !!state.me?.permissions?.includes(p);}
function openModal(html){el('modalBody').innerHTML=html;el('modal').classList.remove('hidden');}
function closeModal(){el('modal').classList.add('hidden');}
function setDates(){const d=new Date();el('dateStart').value=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);el('dateEnd').value=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);}
async function refs(){const [a,b,c]=await Promise.all([rpc('v4_services'),rpc('v4_team_members'),rpc('v4_available_collective_works')]);state.services=a||[];state.team=b||[];state.works=c||[];}
function operationalError(scope,error){console.error(scope,error);el('home').insertAdjacentHTML('afterbegin',`<div class="panel error">Não foi possível carregar ${esc(scope)}: ${esc(error?.message||error)}</div>`);}
async function enter(){state.me=await rpc('v4_me');el('who').textContent=state.me.name+' · '+(state.me.roles||[]).join(', ');el('login').classList.add('hidden');el('app').classList.remove('hidden');setDates();try{await refs();}catch(error){operationalError('referências',error);}await refreshAll();}
async function refreshAll(){const loaders=[['Home',loadHome],['Pessoas',loadPeople],['Contratações',loadContracts],['Financeiro',loadFinance],['Saldos',loadReceivables],['Cobrança',loadCollections],['Permissões',loadPermissions]];const results=await Promise.allSettled(loaders.map(([,load])=>load()));results.forEach((result,index)=>{if(result.status==='rejected')operationalError(loaders[index][0],result.reason);});}
async function loadHome(){const h=await rpc('v4_home',{p_start:el('dateStart').value,p_end:el('dateEnd').value});el('homeMetrics').innerHTML=[['Pessoas',h.people],['Trabalhos abertos',h.openWorks],['Filhos ativos',h.activeHouseMembers],['Recebido',money(h.receivedCents)],['Inconsistências',h.inconsistentObligations]].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');const w=await rpc('v4_available_collective_works');el('openWorks').innerHTML=(w||[]).map(x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${esc(x.status)} · ${money(x.unit_price_cents)}</div></div>`).join('')||'<div class="row">Nenhum trabalho elegível.</div>';}
async function loadPeople(){state.people=await rpc('v4_search_people',{p_query:el('peopleQuery').value||'',p_limit:100});el('peopleList').innerHTML=(state.people||[]).map(p=>`<div class="row"><b>${esc(p.preferred_name||p.full_name)}</b><div class="muted">${esc(p.full_name)} · ${esc(p.phone||'')} · ${esc(p.email||'')}</div></div>`).join('')||'<div class="row">Nenhuma pessoa.</div>';}
async function loadContracts(){const d=await rpc('v4_recent_contracts',{p_limit:100});el('contractList').innerHTML=(d||[]).map(x=>`<div class="row"><b>${esc(x.customer_name)}</b><div class="muted">${x.item_count} item(ns) · ${esc(x.source)}</div><strong>${money(x.total_cents)}</strong></div>`).join('');}
async function loadFinance(){const s=el('dateStart').value,e=el('dateEnd').value;const [f,p]=await Promise.all([rpc('v4_finance_summary',{p_start:s,p_end:e}),rpc('v4_recent_payments',{p_start:s,p_end:e,p_limit:100})]);el('financeMetrics').innerHTML=[['Recebido',money(f.receivedCents)],['Alocado',money(f.allocatedCents)],['Não alocado',money(f.unallocatedCents)],['A receber',money(f.openReceivablesCents)]].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');el('paymentList').innerHTML=(p||[]).map(x=>`<div class="row"><b>${esc(x.payer_name)}</b><div class="muted">${esc(x.source)} · ${esc(x.payment_method||'')}</div><strong>${money(x.amount_cents)}</strong> <span class="muted">livre ${money(x.signed_unallocated_cents)}</span></div>`).join('');}
async function loadReceivables(){const d=await rpc('v4_receivables',{p_only_open:true,p_limit:300});el('receivableList').innerHTML=(d||[]).map(x=>`<div class="row"><b>${esc(x.beneficiary_name)}</b><div class="muted">${esc(x.service_name)} · ${esc(x.liquidation_status)} · ${esc(x.due_status)}</div><strong>Saldo ${money(x.signed_balance_cents)}</strong>${x.signed_balance_cents>0&&has('promise.create')?`<div><button onclick="window.v4Promise('${x.obligation_id}','${esc(x.beneficiary_name)}')">Combinar pagamento</button></div>`:''}</div>`).join('')||'<div class="row">Nenhuma obrigação em aberto.</div>';}
async function loadCollections(){const d=await rpc('v4_collection_tasks',{p_only_open:true,p_limit:200});el('collectionList').innerHTML=(d||[]).map(x=>`<div class="row"><b>${esc(x.beneficiary_name)}</b><div class="muted">${esc(x.service_name)} · ${esc(x.status)} · ${esc(x.scheduled_for)}</div></div>`).join('')||'<div class="row">Nenhuma cobrança agendada.</div>';}
async function loadPermissions(){el('permissionList').innerHTML=`<b>${esc(state.me.name)}</b><div class="muted">${(state.me.roles||[]).join(', ')}</div><p>${(state.me.permissions||[]).map(esc).join(' · ')}</p>`;}
function personOptions(){return state.people.map(p=>`<option value="${p.id}">${esc(p.preferred_name||p.full_name)}</option>`).join('');}
function serviceOptions(){return state.services.map(s=>`<option value="${s.service_id}" data-name="${esc(s.name)}" data-price="${s.default_price_cents}">${esc(s.name)}</option>`).join('');}
function workOptions(){return state.works.map(w=>`<option value="${w.work_id}">${esc(w.title)}</option>`).join('');}
function teamOptions(){return state.team.map(t=>`<option value="${t.member_id}">${esc(t.full_name)}</option>`).join('');}
function openPerson(){openModal(`<h3>Nova pessoa</h3><form id="personForm"><input id="pName" placeholder="Nome completo" required><input id="pPref" placeholder="Nome preferido"><input id="pPhone" placeholder="Telefone"><input id="pEmail" type="email" placeholder="E-mail"><button>Salvar</button></form>`);el('personForm').onsubmit=async ev=>{ev.preventDefault();await rpc('v4_api_create_person',{p_full_name:el('pName').value,p_preferred_name:el('pPref').value||null,p_phone:el('pPhone').value||null,p_email:el('pEmail').value||null});closeModal();await loadPeople();};}
function openEntry(){openModal(`<h3>Registrar contratação / pagamento</h3><form id="entryForm"><label>Cliente</label><select id="eCustomer" required><option value="">Selecione</option>${personOptions()}</select><div class="two"><div><label>Valor recebido agora</label><input id="eReceived" value="0,00"></div><div><label>Forma</label><select id="eMethod"><option>PIX</option><option>DINHEIRO</option><option>CARTAO</option><option>TRANSFERENCIA</option><option>REMESSA_INTERNACIONAL</option><option>OUTRO</option></select></div></div><label>Pagador cadastrado (opcional)</label><select id="ePayer"><option value="">Outro / não vincular</option>${personOptions()}</select><input id="ePayerName" placeholder="Nome do pagador se diferente"><hr><label>Beneficiário</label><select id="eBenef" required><option value="">Selecione</option>${personOptions()}</select><label>Serviço</label><select id="eService" required><option value="">Selecione</option>${serviceOptions()}</select><label>Trabalho coletivo (se aplicável)</label><select id="eWork"><option value="">Nenhum</option>${workOptions()}</select><label>Responsável</label><select id="eResp"><option value="">Não definido</option>${teamOptions()}</select><div class="two"><div><label>Valor do item</label><input id="eAmount" required></div><div><label>Quanto alocar deste pagamento</label><input id="eAllocate" value="0,00"></div></div><div class="two"><div><label>Vencimento</label><input id="eDue" type="date"></div><div><label>Data combinada</label><input id="ePromise" type="date"></div></div><label>Próxima cobrança</label><input id="eCollect" type="date"><button>Salvar lançamento</button></form>`);el('eService').onchange=()=>{const o=el('eService').selectedOptions[0];if(o?.dataset.price)el('eAmount').value=(Number(o.dataset.price)/100).toFixed(2).replace('.',',');};el('entryForm').onsubmit=async ev=>{ev.preventDefault();const o=el('eService').selectedOptions[0];const payload={idempotencyKey:'ui-'+crypto.randomUUID(),customerPersonId:el('eCustomer').value,payerPersonId:el('ePayer').value||null,payerSnapshot:{name:el('ePayerName').value||null},source:'MANUAL_V4',paymentMethod:el('eMethod').value,receivedCents:cents(el('eReceived').value),items:[{beneficiaryPersonId:el('eBenef').value,serviceId:el('eService').value,serviceCode:'SERVICE:'+el('eService').value,serviceName:o?.dataset.name||'Lançamento',workId:el('eWork').value||null,responsibleMemberId:el('eResp').value||null,amountCents:cents(el('eAmount').value),allocateCents:cents(el('eAllocate').value),dueDate:el('eDue').value||null,expectedPaymentDate:el('ePromise').value||null,nextCollectionDate:el('eCollect').value||null}]};await rpc('v4_api_register_manual_entry',{p_payload:payload});closeModal();await refreshAll();};}
window.v4Promise=function(id,name){openModal(`<h3>Combinar pagamento — ${esc(name)}</h3><form id="promiseForm"><label>Data combinada</label><input id="prDate" type="date" required><label>Próxima cobrança</label><input id="prCol" type="date"><textarea id="prNote" placeholder="Observação"></textarea><button>Salvar promessa</button></form>`);el('promiseForm').onsubmit=async ev=>{ev.preventDefault();await rpc('v4_api_create_promise',{p_obligation_id:id,p_promised_for:el('prDate').value,p_next_collection_date:el('prCol').value||null,p_note:el('prNote').value||null});if(el('prCol').value&&has('collection.create'))await rpc('v4_api_create_collection_task',{p_obligation_id:id,p_scheduled_for:el('prCol').value,p_note:'Cobrança criada pela V4'});closeModal();await Promise.all([loadReceivables(),loadCollections()]);};};
async function init(){if(!window.supabase){msg('Falha ao carregar o módulo de login. Atualize a página.','error');return;}sb=window.supabase.createClient(URL,KEY);el('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const btn=el('loginBtn');btn.disabled=true;msg('Entrando...');try{const k=el('username').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const email=aliases[k]||k;const r=await sb.auth.signInWithPassword({email,password:el('password').value});if(r.error)throw r.error;await enter();}catch(e){msg(e.message||'Não foi possível entrar.','error');}finally{btn.disabled=false;}});el('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};el('closeModal').onclick=closeModal;el('peopleSearch').onclick=loadPeople;el('newPerson').onclick=openPerson;el('newEntry1').onclick=openEntry;el('newEntry2').onclick=openEntry;el('financeApply').onclick=loadFinance;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));el(b.dataset.page).classList.add('active');});const {data:{session}}=await sb.auth.getSession();if(session)await enter();}
window.addEventListener('error',e=>{if(el('loginMsg')&&!el('login').classList.contains('hidden'))msg('Erro no aplicativo: '+e.message,'error');});
init();
})();
</script></body></html>
