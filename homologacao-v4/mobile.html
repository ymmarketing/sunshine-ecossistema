<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Sunshine V4 — Homologação Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f4f0}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f4f0}
</style>
</head>
<body>
<iframe id="app" src="./index.html" title="Sunshine V4 — Homologação de navegação"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const fix=doc.createElement('style');
    fix.textContent='.menu-sheet{display:none!important}.menu-sheet.open{display:flex!important}';
    doc.head.appendChild(fix);
    const sheet=doc.getElementById('menuSheet');
    if(sheet&&!sheet.classList.contains('open')) sheet.style.display='none';
    const menuBtn=doc.getElementById('menuBtn');
    const moreBtn=doc.getElementById('moreBtn');
    const closeBtn=doc.getElementById('closeMenu');
    const open=()=>{if(sheet){sheet.style.removeProperty('display');sheet.classList.add('open')}};
    const close=()=>{if(sheet){sheet.classList.remove('open');sheet.style.display='none'}};
    if(menuBtn) menuBtn.addEventListener('click',open);
    if(moreBtn) moreBtn.addEventListener('click',open);
    if(closeBtn) closeBtn.addEventListener('click',close);
    if(sheet) sheet.addEventListener('click',e=>{if(e.target===sheet) close()});
  }catch(e){console.error('Homologação mobile hotfix',e)}
});
</script>
</body>
</html>
