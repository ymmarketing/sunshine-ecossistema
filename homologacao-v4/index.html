<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1e1d1b;--muted:#736f68;--line:#dfddd7;--soft:#eeece6;--accent:#25231f;--warn:#fff3cc;--warn-ink:#6e5812;--good:#e8f4ec;--good-ink:#28613b;--bad:#ffe5df;--bad-ink:#8a3d31;--shadow:0 8px 30px rgba(25,24,21,.06)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand small{display:block;font-size:10px;font-weight:900;letter-spacing:.13em;color:var(--muted)}.brand strong{font-size:17px}.top-actions{display:flex;gap:7px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:800}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;padding:18px}.side{position:sticky;top:82px;height:calc(100vh - 100px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}.navbtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#514e48;padding:11px 12px;border-radius:11px;text-align:left;cursor:pointer;font-weight:720}.navbtn:hover{background:#f5f3ee}.navbtn.active{background:var(--accent);color:#fff}.navbtn span{width:21px;text-align:center}.main{min-width:0;padding-bottom:34px}.banner{background:var(--warn);color:var(--warn-ink);border:1px solid #e6d799;border-radius:14px;padding:10px 13px;margin-bottom:12px;font-size:12px}.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}.page-head h1{font-size:24px;margin:0}.page-head p{margin:4px 0 0;color:var(--muted)}.primary,.secondary,.chipbtn{border:0;border-radius:11px;min-height:42px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{display:block;font-size:21px;margin-top:3px}.metric em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.card h2,.card h3{margin:0 0 10px}.card h2{font-size:17px}.card h3{font-size:14px}.section-title{font-size:11px;letter-spacing:.09em;font-weight:900;color:var(--muted);margin:3px 0 8px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.quick button{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:13px;text-align:left;padding:10px 12px;font-weight:800;color:var(--ink)}.list{display:grid;gap:8px}.row{border:1px solid #e7e4de;border-radius:13px;padding:11px;background:#fff}.row-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.row p{margin:3px 0 0;color:var(--muted);font-size:12px}.amount{font-weight:900;white-space:nowrap}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{padding:3px 7px;border-radius:999px;background:var(--soft);font-size:10px;font-weight:850}.badge.good{background:var(--good);color:var(--good-ink)}.badge.warn{background:var(--warn);color:var(--warn-ink)}.badge.bad{background:var(--bad);color:var(--bad-ink)}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:10px}.chipbtn{min-height:35px;padding:6px 10px;background:#fff;color:#514e48;border:1px solid var(--line);white-space:nowrap}.chipbtn.active{background:#292722;color:#fff}.search{position:relative;margin-bottom:11px}.search input,.field input,.field select{width:100%;min-height:44px;border:1px solid #cbc8c0;background:#fff;border-radius:11px;padding:10px 11px}.client-result{cursor:pointer}.client-detail{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line)}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.detail-box{background:#f7f5f1;border-radius:10px;padding:9px}.detail-box small{display:block;color:var(--muted)}.timeline{border-left:2px solid #e7e4dc;padding-left:13px;margin-left:4px}.event{position:relative;margin:0 0 13px}.event:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:#292722}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:74px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;font-size:11px}.day strong{display:block}.appointment{margin-top:5px;background:#efede8;border-radius:7px;padding:4px 5px;font-size:9px}.work-card{cursor:pointer}.progress{height:7px;background:#ece9e3;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#34312b}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #ece9e3;text-align:left;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}.drawer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end}.drawer-panel{width:min(520px,100%);height:100%;overflow:auto;background:#f7f6f2;padding:18px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head h2{margin:0}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;font-weight:800}.toggle{display:flex;gap:6px}.toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;font-weight:800}.toggle button.active{background:#24221f;color:#fff}.bottom{display:none}.menu-sheet{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.38);align-items:flex-end}.menu-sheet.open{display:flex}.menu-panel{width:100%;max-height:78vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:15px 14px calc(18px + env(safe-area-inset-bottom))}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left;font-weight:800}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:80;background:#22201d;color:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 9px 28px rgba(0,0,0,.23);font-size:12px;max-width:calc(100vw - 24px)}
@media(max-width:880px){.layout{display:block;padding:12px 10px 90px}.side{display:none}.top{padding-left:12px;padding-right:12px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.page-head h1{font-size:21px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.bottom button{border:0;background:transparent;min-height:50px;border-radius:10px;color:#625e57;font-size:10px;font-weight:800}.bottom button b{display:block;font-size:17px}.bottom button.active{background:#efede8;color:#1d1c19}.calendar{grid-template-columns:repeat(2,1fr)}.day{min-height:90px}.page-head{align-items:center}.page-head .primary{min-height:40px;font-size:12px}.detail-grid{grid-template-columns:1fr 1fr}}

<body>
<header class="top"><div class="brand"><small>SUNSHINE V4</small><strong>Homologação de navegação</strong></div><div class="top-actions"><button class="iconbtn" id="feedbackBtn" title="Registrar observação">✎</button><button class="iconbtn" id="menuBtn" title="Menu">☰</button></div></header>
<div class="layout"><aside class="side" id="sideNav"></aside><main class="main">
<div class="banner"><strong>Ambiente visual fictício.</strong> Esta versão existe somente para validar navegação, organização e usabilidade. Não há banco, clientes reais, Asaas, Reportei, Drive ou qualquer integração conectada.</div>
<div id="pages"></div>
</main></div>
<nav class="bottom" id="bottomNav"><button data-page="home"><b>⌂</b>Home</button><button data-page="pessoas"><b>◉</b>Pessoas</button><button data-page="agenda"><b>▦</b>Agenda</button><button data-page="financeiro"><b>R$</b>Financeiro</button><button id="moreBtn"><b>☰</b>Menu</button></nav>
<div class="menu-sheet" id="menuSheet"><div class="menu-panel"><div class="drawer-head"><h2>Todas as áreas</h2><button class="iconbtn" id="closeMenu">×</button></div><div class="menu-grid" id="menuGrid"></div></div></div>
<div class="drawer hidden" id="drawer"><div class="drawer-panel"><div class="drawer-head"><h2 id="drawerTitle">Detalhe</h2><button class="iconbtn" id="closeDrawer">×</button></div><div id="drawerBody"></div></div></div>
<div class="toast hidden" id="toast"></div>
<script>
const modules=[
['home','⌂','Home'],['pessoas','◉','Pessoas'],['agenda','▦','Agenda'],['consultas','◇','Consultas'],['perguntas','?','Pergunta Objetiva'],['trabalhos','✦','Trabalhos'],['financeiro','R$','Financeiro'],['filhos','♢','Filhos da Casa'],['campanhas','◎','Campanhas'],['performance','↗','Performance'],['arquivos','▤','Arquivos'],['integracoes','⛓','Integrações']];
const demo={people:[
{name:'Maria Demo',phone:'(31) 99999-0001',origin:'Instagram',last:'Agrado coletivo',status:'Ativa',balance:0},{name:'Jakeline Demo',phone:'(31) 99999-0002',origin:'YouTube',last:'Agrado coletivo',status:'Ativa',balance:0},{name:'Fátima Demo',phone:'(31) 99999-0003',origin:'Indicação',last:'Agrado coletivo',status:'Pendente',balance:35},{name:'Luiz Demo',phone:'(31) 99999-0004',origin:'Instagram',last:'Trabalho particular',status:'Pendente',balance:300},{name:'Carla Demo',phone:'(31) 99999-0005',origin:'TikTok',last:'Jogo de búzios',status:'Ativa',balance:0}],
payments:[['Maria Demo','R$ 140,00','Agrado coletivo · 2 inscrições','Pago'],['Maria Demo','R$ 300,00','Trabalho particular de Luiz Demo','Parcial'],['Fátima Demo','R$ 35,00','Agrado coletivo','Parcial'],['Carla Demo','R$ 250,00','Jogo de búzios','Pago']],
works:[{name:'Agrado Coletivo — Sete Saias',date:'10/09/2026',people:42,paid:39,revenue:'R$ 2.870,00'},{name:'Trabalho Coletivo — Abertura de Caminhos',date:'18/09/2026',people:17,paid:14,revenue:'R$ 1.680,00'},{name:'Trabalho Particular — Luiz Demo',date:'20/09/2026',people:1,paid:0,revenue:'R$ 300,00 / R$ 600,00'}]};
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),2200)}
function row(title,sub,right,badges=''){return `<div class="row"><div class="row-head"><div><strong>${title}</strong><p>${sub}</p></div><span class="amount">${right||''}</span></div>${badges?`<div class="badges">${badges}</div>`:''}</div>`}
function metric(label,value,note,page){return `<div class="metric" data-go="${page}"><span>${label}</span><b>${value}</b><em>${note}</em></div>`}
function pageHead(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function home(){return `${pageHead('Home','O que precisa de atenção hoje')}
<div class="metrics">${metric('Pagamentos pendentes','R$ 335','2 pessoas para cobrar','financeiro')}${metric('Perguntas pendentes','3','1 vence hoje','perguntas')}${metric('Agenda de hoje','4','2 consultas · 2 retornos','agenda')}${metric('Comissões abertas','R$ 1.645','visual fictício','financeiro')}</div>
<div class="grid"><section class="card"><div class="section-title">ATALHOS</div><div class="quick"><button data-action="novo-cliente">＋ Novo cliente</button><button data-action="novo-atendimento">▦ Novo atendimento</button><button data-action="novo-pagamento">R$ Registrar pagamento</button><button data-action="nova-inscricao">✦ Inscrever em trabalho</button></div></section><section class="card"><div class="section-title">PRÓXIMAS AÇÕES</div><div class="list">${row('Luiz Demo','Saldo de trabalho particular · cobrar dia 20','R$ 300,00','<span class="badge warn">COBRANÇA PROGRAMADA</span>')}${row('Fátima Demo','Promessa de pagamento para 20/09','R$ 35,00','<span class="badge warn">PARCIAL</span>')}${row('Pergunta objetiva — Ana Demo','Aguardando resposta · 26h restantes','','<span class="badge warn">PENDENTE</span>')}</div></section></div>
<section class="card" style="margin-top:12px"><div class="section-title">ÚLTIMOS PAGAMENTOS</div><div class="list">${demo.payments.map(p=>row(p[0],p[2],p[1],`<span class="badge ${p[3]=='Pago'?'good':'warn'}">${p[3]}</span>`)).join('')}</div></section>`}
function pessoas(){return `${pageHead('Pessoas','Buscar primeiro. Cadastrar somente quando necessário','<button class="primary" data-action="novo-cliente">＋ Pessoa</button>')}<section class="card"><div class="search"><input id="peopleSearch" placeholder="Buscar por nome, telefone ou e-mail"></div><div id="peopleList" class="list">${peopleRows(demo.people)}</div></section>`}
function peopleRows(items){return items.map((p,i)=>`<div class="row client-result" data-client="${i}"><div class="row-head"><div><strong>${p.name}</strong><p>${p.phone} · origem: ${p.origin}</p></div><span>⌄</span></div><div class="badges"><span class="badge ${p.balance?'warn':'good'}">${p.balance?`PENDENTE R$ ${p.balance}`:'SEM PENDÊNCIA'}</span><span class="badge">${p.last}</span></div><div class="client-detail hidden"><div class="detail-grid"><div class="detail-box"><small>Último atendimento</small><b>${p.last}</b></div><div class="detail-box"><small>Saldo</small><b>${brl(p.balance)}</b></div><div class="detail-box"><small>Origem</small><b>${p.origin}</b></div><div class="detail-box"><small>Status</small><b>${p.status}</b></div></div><div class="timeline" style="margin-top:13px"><div class="event"><b>09/09</b><p>Pagamento/atendimento fictício registrado</p></div><div class="event"><b>02/09</b><p>Contato pelo WhatsApp</p></div></div></div></div>`).join('')}
function agenda(){return `${pageHead('Agenda','Visualização rápida e sem perder posição','<button class="primary" data-action="novo-atendimento">＋ Agendar</button>')}<div class="filters"><button class="chipbtn active">Hoje</button><button class="chipbtn">Semana</button><button class="chipbtn">Mês</button><button class="chipbtn">Pendentes</button></div><section class="card"><div class="calendar">${['Seg 7','Ter 8','Qua 9','Qui 10','Sex 11','Sáb 12','Dom 13'].map((d,i)=>`<div class="day"><strong>${d}</strong>${i==2?'<div class="appointment">10:00 · Búzios<br>14:30 · Baralho</div>':''}${i==3?'<div class="appointment">19:00 · Sete Saias</div>':''}</div>`).join('')}</div></section><section class="card" style="margin-top:12px"><div class="section-title">HOJE</div><div class="list">${row('10:00 · Carla Demo','Jogo de búzios · Yasmin','','<span class="badge good">CONFIRMADO</span>')}${row('14:30 · Beatriz Demo','Baralho cigano · Rose','','<span class="badge">AGENDADO</span>')}${row('17:00 · Retorno Limpeza','21 dias · mensagem de acompanhamento','','<span class="badge warn">RETORNO</span>')}</div></section>`}
function consultas(){return `${pageHead('Consultas','Búzios, Baralho e histórico por período','<button class="primary" data-action="novo-atendimento">＋ Consulta</button>')}<div class="filters"><button class="chipbtn active">Setembro</button><button class="chipbtn">Búzios</button><button class="chipbtn">Baralho</button><button class="chipbtn">Atendidos</button><button class="chipbtn">Faltas</button></div><section class="card"><div class="list">${row('Carla Demo','09/09 · Jogo de búzios · Yasmin','R$ 250','<span class="badge good">ATENDIDA</span>')}${row('Beatriz Demo','09/09 · Baralho cigano · Rose','R$ 200','<span class="badge">AGENDADA</span>')}${row('Paulo Demo','08/09 · Jogo de búzios · Yasmin','R$ 250','<span class="badge warn">REAGENDAR</span>')}</div></section>`}
function perguntas(){return `${pageHead('Pergunta Objetiva','Fila até a pergunta ser efetivamente respondida','<button class="primary" data-action="nova-pergunta">＋ Pergunta</button>')}<div class="metrics">${metric('Aguardando pergunta','1','cliente ainda não enviou','perguntas')}${metric('Aguardando resposta','3','fila de resposta','perguntas')}${metric('Respondidas','12','no período','perguntas')}${metric('Canceladas','0','no período','perguntas')}</div><section class="card"><div class="filters"><button class="chipbtn active">Pendentes</button><button class="chipbtn">Todas</button><button class="chipbtn">Hoje</button></div><div class="list">${row('Ana Demo','“Devo aceitar a nova proposta de trabalho?” · recebida 09/09','','<span class="badge warn">AGUARDANDO RESPOSTA</span><span class="badge">26h restantes</span>')}${row('Marina Demo','Pagamento confirmado · ainda não enviou a pergunta','','<span class="badge warn">AGUARDANDO PERGUNTA</span>')}${row('Lúcia Demo','Respondida em vídeo · 08/09','','<span class="badge good">RESPONDIDA</span>')}</div></section>`}
function trabalhos(){return `${pageHead('Trabalhos','Coletivos, agrados e particulares','<button class="primary" data-action="novo-trabalho">＋ Trabalho</button>')}<div class="filters"><button class="chipbtn active">Ativos</button><button class="chipbtn">Agrados</button><button class="chipbtn">Coletivos</button><button class="chipbtn">Particulares</button></div><div class="grid">${demo.works.map((w,i)=>`<section class="card work-card" data-work="${i}"><div class="section-title">${w.date}</div><h2>${w.name}</h2><div class="row-head"><p>${w.people} inscritos · ${w.paid} pagos</p><b>${w.revenue}</b></div><div class="progress"><i style="width:${Math.min(100,w.paid/w.people*100)}%"></i></div><div class="badges"><span class="badge">Ver inscritos</span><span class="badge">Ver pagamentos</span></div></section>`).join('')}</div>`}
function financeiro(){return `${pageHead('Financeiro','Recebimentos, pendências e comissões no mesmo núcleo','<button class="primary" data-action="novo-pagamento">＋ Lançamento</button>')}<div class="metrics">${metric('Recebido no período','R$ 12.703,72','dado fictício de layout','financeiro')}${metric('A receber','R$ 335,00','2 obrigações abertas','financeiro')}${metric('Não alocado','R$ 15,00','crédito/excesso visível','financeiro')}${metric('Comissões abertas','R$ 1.645,00','45 lançamentos fictícios','financeiro')}</div><div class="filters"><button class="chipbtn active">Recebimento</button><button class="chipbtn">Venda</button><button class="chipbtn">Competência</button><button class="chipbtn">01/09 → 30/09</button><button class="chipbtn">Pendentes</button></div><section class="card"><div class="section-title">MOVIMENTAÇÕES MAIS RECENTES</div><div class="table-wrap"><table class="table"><thead><tr><th>Pessoa/Pagador</th><th>Referência</th><th>Recebido</th><th>Alocado</th><th>Saldo</th><th>Status</th></tr></thead><tbody><tr><td>Maria Demo</td><td>2 inscrições Sete Saias</td><td>R$ 140</td><td>R$ 140</td><td>R$ 0</td><td><span class="badge good">PAGO</span></td></tr><tr><td>Fátima Demo</td><td>Agrado coletivo</td><td>R$ 35</td><td>R$ 35</td><td>R$ 35</td><td><span class="badge warn">PARCIAL</span></td></tr><tr><td>Maria Demo → Luiz Demo</td><td>Trabalho particular</td><td>R$ 300</td><td>R$ 300</td><td>R$ 300</td><td><span class="badge warn">PARCIAL</span></td></tr><tr><td>Maria Demo</td><td>Pergunta objetiva</td><td>R$ 50</td><td>R$ 35</td><td>+ R$ 15</td><td><span class="badge">NÃO ALOCADO</span></td></tr></tbody></table></div></section>`}
function filhos(){return `${pageHead('Filhos da Casa','Mensalidade por competência e inadimplência visível','<button class="primary" data-action="novo-filho">＋ Filho da Casa</button>')}<div class="metrics">${metric('Ativos','12','cadastros','filhos')}${metric('Pagos','5','setembro','filhos')}${metric('Pendentes','4','R$ 800','filhos')}${metric('Isentos','3','sem obrigação','filhos')}</div><section class="card"><div class="filters"><button class="chipbtn active">Setembro/26</button><button class="chipbtn">Pendentes</button><button class="chipbtn">Pagos</button><button class="chipbtn">Isentos</button></div><div class="list">${row('Joana Demo','Vencimento dia 10','R$ 200','<span class="badge good">PAGO</span>')}${row('Carlos Demo','Vencimento dia 10','R$ 200','<span class="badge warn">PENDENTE</span>')}${row('Renata Demo','Isenção registrada','R$ 0','<span class="badge">ISENTO</span>')}</div></section>`}
function campanhas(){return `${pageHead('Campanhas','Campanhas e trabalhos promocionais sem misturar regras globais','<button class="primary" data-action="nova-campanha">＋ Campanha</button>')}<div class="grid"><section class="card"><div class="section-title">ATIVA</div><h2>Agrado Coletivo — Sete Saias</h2><p>42 inscritos · 39 pagos · 10/09/2026</p><div class="badges"><span class="badge good">EM ANDAMENTO</span><span class="badge">Instagram + Live</span></div></section><section class="card"><div class="section-title">ENCERRADA</div><h2>Bruxa Valentina</h2><p>Receita de referência: R$ 900</p><div class="badges"><span class="badge">ENCERRADA</span></div></section></div>`}
function performance(){return `${pageHead('Performance','KPIs de marketing sem misturar com o financeiro operacional')}<div class="metrics">${metric('Alcance','84,2 mil','30 dias','performance')}${metric('Engajamento','6,8%','30 dias','performance')}${metric('Leads','126','30 dias','performance')}${metric('Conversões','34','30 dias','performance')}</div><section class="card"><div class="section-title">LEITURA</div><h2>Conteúdo não é faturamento sozinho</h2><p style="color:var(--muted)">Nesta homologação os números são apenas fictícios para validar disposição, filtros e leitura mobile.</p><div style="height:170px;margin-top:12px;border-radius:13px;background:linear-gradient(180deg,#f0eee8,#fff);display:flex;align-items:flex-end;gap:8px;padding:14px">${[40,65,35,82,58,72,49].map(n=>`<i style="height:${n}%;flex:1;background:#aaa69e;border-radius:6px 6px 2px 2px"></i>`).join('')}</div></section>`}
function arquivos(){return `${pageHead('Arquivos','Links e comprovantes organizados por contexto','<button class="primary" data-action="novo-arquivo">＋ Arquivo</button>')}<section class="card"><div class="search"><input placeholder="Buscar arquivo, cliente ou trabalho"></div><div class="list">${row('Fotos — Sete Saias','Trabalho · 10/09/2026','Abrir','<span class="badge">DEMO</span>')}${row('Comprovante — Maria Demo','Pagamento fictício · 09/09/2026','Abrir','<span class="badge">DEMO</span>')}${row('Vídeo resposta — Ana Demo','Pergunta objetiva · 09/09/2026','Abrir','<span class="badge">DEMO</span>')}</div></section>`}
function integracoes(){return `${pageHead('Integrações','Nesta fase nenhuma integração real deve estar ativa')}<div class="grid">${['Asaas','Reportei','Google Drive','WhatsApp','Supabase V3','Domínios oficiais'].map(x=>`<section class="card"><h2>${x}</h2><p style="color:var(--muted)">Desconectado nesta homologação de navegação.</p><span class="badge">NÃO CONECTADO</span></section>`).join('')}</div>`}
const renderers={home,pessoas,agenda,consultas,perguntas,trabalhos,financeiro,filhos,campanhas,performance,arquivos,integracoes};
function build(){sideNav.innerHTML=modules.map(([id,icon,label])=>`<button class="navbtn" data-page="${id}"><span>${icon}</span>${label}</button>`).join('');menuGrid.innerHTML=modules.map(([id,icon,label])=>`<button data-page="${id}">${icon} &nbsp;${label}</button>`).join('');pages.innerHTML=modules.map(([id])=>`<section class="page" id="page-${id}">${renderers[id]()}</section>`).join('');bind()}
function go(id){if(!renderers[id])id='home';document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${id}`));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));location.hash=id;menuSheet.classList.remove('open');window.scrollTo({top:0,behavior:'instant'});bindPage(id)}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openAction(b.dataset.action));moreBtn.onclick=()=>menuSheet.classList.add('open');menuBtn.onclick=()=>menuSheet.classList.add('open');closeMenu.onclick=()=>menuSheet.classList.remove('open');menuSheet.onclick=e=>{if(e.target===menuSheet)menuSheet.classList.remove('open')};closeDrawer.onclick=()=>drawer.classList.add('hidden');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.add('hidden')};feedbackBtn.onclick=()=>{drawerTitle.textContent='Observação de homologação';drawerBody.innerHTML='<p>Use esta área para anotar mentalmente o que quer mudar. Nenhuma informação será enviada ou salva nesta versão.</p><div class="field"><label>Sua observação</label><textarea style="width:100%;min-height:160px;border:1px solid #cbc8c0;border-radius:11px;padding:10px" placeholder="Ex.: Quero o Financeiro antes de Trabalhos no menu"></textarea></div><button class="primary" onclick="toast(\'Observação simulada — nada foi enviado\')">Simular registro</button>';drawer.classList.remove('hidden')}}
function bindPage(id){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>openAction(b.dataset.action));if(id==='pessoas'){const inp=document.getElementById('peopleSearch');if(inp)inp.oninput=()=>{const q=inp.value.toLowerCase();peopleList.innerHTML=peopleRows(demo.people.filter(p=>(p.name+' '+p.phone).toLowerCase().includes(q)));bindClients()};bindClients()}if(id==='trabalhos')document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>openWork(Number(b.dataset.work)));document.querySelectorAll('.chipbtn').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.chipbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('Filtro visual aplicado')})}
function bindClients(){document.querySelectorAll('.client-result').forEach(r=>r.onclick=e=>{if(e.target.closest('button'))return;const d=r.querySelector('.client-detail');d.classList.toggle('hidden')})}
function openWork(i){const w=demo.works[i];drawerTitle.textContent=w.name;drawerBody.innerHTML=`<div class="metrics" style="grid-template-columns:1fr 1fr"><div class="metric"><span>Inscritos</span><b>${w.people}</b></div><div class="metric"><span>Pagos</span><b>${w.paid}</b></div></div><h3>Lista de inscritos</h3><div class="list">${row('Maria Demo','Inscrição 08/09 · Pix','R$ 70','<span class="badge good">PAGO</span>')}${row('Jakeline Demo','Inscrição 08/09 · pago por Maria Demo','R$ 70','<span class="badge good">PAGO</span>')}${row('Fátima Demo','Inscrição 09/09 · pagou R$ 35','Saldo R$ 35','<span class="badge warn">PARCIAL</span>')}</div>`;drawer.classList.remove('hidden')}
function openAction(a){const title={ 'novo-cliente':'Nova pessoa','novo-atendimento':'Novo atendimento','novo-pagamento':'Lançamento manual','nova-inscricao':'Inscrição em trabalho','nova-pergunta':'Nova pergunta objetiva','novo-trabalho':'Novo trabalho','novo-filho':'Novo Filho da Casa','nova-campanha':'Nova campanha','novo-arquivo':'Novo arquivo'}[a]||'Ação';drawerTitle.textContent=title;if(a==='novo-pagamento'){drawerBody.innerHTML='<p style="color:#736f68">Fluxo propositalmente curto para validar a experiência.</p><div class="field"><label>Vamos cadastrar o quê?</label><select><option>Pagamento / recebimento</option><option>Inscrição em trabalho</option><option>Consulta</option><option>Pergunta objetiva</option></select></div><div class="field"><label>Pagou quanto?</label><input value="35,00"></div><div class="field"><label>É inscrição de quantas pessoas?</label><input type="number" value="1"></div><div class="field"><label>O pagamento está completo ou pendente?</label><div class="toggle"><button class="active">Completo</button><button>Pendente</button></div></div><button class="primary" onclick="toast(\'Simulação concluída — nada foi salvo\')">Continuar</button>'}else{drawerBody.innerHTML=`<p>Este é um fluxo de homologação visual de <strong>${title}</strong>.</p><div class="field"><label>Pessoa</label><input placeholder="Digite para buscar pessoa existente"></div><div class="field"><label>Detalhe</label><input placeholder="Informação fictícia"></div><button class="primary" onclick="toast('Simulação concluída — nada foi salvo')">Continuar</button>`}drawer.classList.remove('hidden')}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'home'));build();go(location.hash.slice(1)||'home');
</script>
</body></html>
